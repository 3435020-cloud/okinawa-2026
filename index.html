<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Okinawa Trip 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Zen+Old+Mincho:wght@400;700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#f8fafc;--sky:#5b93b3;--deep:#2f6785;--pale:#dce8f1;--ink:#27465a;--mute:#6f8798;--line:#d3dde8;--cream:#e4edf5;--warn:#fff1e6;--warnb:#e3a36f;--red:#e3774b;--green:#6a9f86;--gold:#e9c46a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:56px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Zen Old Mincho","Hiragino Mincho ProN",serif;line-height:1.8;letter-spacing:.03em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:2px;overflow-x:auto;padding:8px 12px;background:rgba(238,242,247,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:13px}
nav a{color:var(--deep);text-decoration:none;padding:3px 12px;border-radius:99px;white-space:nowrap}
nav a:hover{background:var(--pale)}
.hero{max-width:980px;margin:0 auto;padding:22px 22px 44px;background:var(--bg)}
.hero h1{font-size:28px;margin:0 0 8px;color:var(--deep)}
.hero p{margin:0;color:var(--mute);font-size:14px}
main{max-width:980px;margin:0 auto;padding:0 20px 60px}
section{margin-bottom:32px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
h2{font-size:20px;color:var(--deep);margin-top:0;border-bottom:2px solid var(--pale);padding-bottom:8px}
</style>
</head>
<body>
<nav>
  <a href="#overview">總覽</a>
  <a href="#schedule">行程</a>
</nav>

<div class="hero">
  <h1>Okinawa Trip 2026</h1>
  <p>沖繩自由行行程規劃與指南</p>
</div>

<main>
  <section id="overview">
    <h2>行程總覽</h2>
    <p>歡迎使用您的沖繩旅遊專屬頁面！這裡為您整合了完整的行程安排。</p>
  </section>

  <section id="schedule">
    <h2>詳細行程</h2>
    <p>準備好展開美好的沖繩之旅了嗎？請依照上方導覽列查看各天細節。</p>
  </section>
</main>

</body>
</html>
